<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17362f">
  <meta name="description" content="Farbwirbel – ein kleines Musterpuzzle für zwischendurch. 10 Level, ohne Konto und offline spielbar.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Farbwirbel">
  <link id="favicon" rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Farbwirbel · Musterpuzzle</title>
  <style>
    :root{color-scheme:dark;--bg:#102c26;--ink:#f5f4e9;--muted:#b8c6b9;--accent:#ffd97c;--line:#ffffff25;--panel:#21473d;--shadow:0 10px 38px #031b1750}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    body{min-height:100svh;background:radial-gradient(ellipse at 110% -10%,#446e4755 0,transparent 55%),radial-gradient(ellipse at -20% 60%,#1e697347 0,transparent 45%),var(--bg)}
    button{font:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;border:0;color:inherit}
    button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    button[disabled]{opacity:.45;cursor:default}
    .app{max-width:490px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 19px calc(22px + env(safe-area-inset-bottom));min-height:100svh}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
    .wordmark{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:850;letter-spacing:-.7px}
    .mark{width:31px;height:31px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;transform:rotate(-6deg)}
    .mark i{border-radius:4px}.mark i:nth-child(1){background:#ffd777}.mark i:nth-child(2){background:#fa9a7c}.mark i:nth-child(3){background:#79d6b2}.mark i:nth-child(4){background:#97bbff}
    .headerbuttons{display:flex;gap:5px}.iconbutton{min-width:40px;min-height:40px;border-radius:14px;background:#ffffff08;display:grid;place-items:center;font-size:19px}.iconbutton:active{background:#ffffff15}
    .smallcaps{color:var(--muted);font-size:12px;font-weight:750;letter-spacing:1.6px;text-transform:uppercase}
    .heroinfo{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:22px 0 18px}
    h1{font-size:31px;letter-spacing:-1px;line-height:1.07;margin:4px 0 0;font-weight:800}
    .moves{text-align:right;flex-shrink:0}.moves strong{font-size:27px;display:block;font-variant-numeric:tabular-nums}.moves span{color:var(--muted);font-size:12px}
    .goalbox{padding:10px 13px;background:#ffffff07;border:1px solid var(--line);border-radius:16px;margin-bottom:13px}
    .goalhead{display:flex;gap:7px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}.goalhead strong{color:var(--ink);font-weight:650}
    .goals{display:flex;gap:10px;overflow-x:auto;scrollbar-width:thin;padding:2px 0 3px;touch-action:pan-x}
    .goalrow{display:flex;gap:4px;align-items:center;flex:0 0 auto}.goal-label{color:var(--muted);font-size:11px;margin-right:1px}
    .board{display:grid;gap:7px;padding:9px;background:#0b241fdd;border:1px solid #ffffff16;border-radius:23px;box-shadow:var(--shadow);touch-action:pan-y}
    .gridrow{display:grid;gap:6px;position:relative}
    .tile{position:relative;aspect-ratio:1;border-radius:clamp(10px,3.4vw,16px);display:grid;place-items:center;min-width:0;transition:transform .18s ease,box-shadow .18s ease,background .18s;border:2px solid #ffffff22;box-shadow:inset 0 3px 0 #ffffff26,0 3px 2px #041e1740;overflow:hidden}
    .tile svg{width:76%;height:76%;display:block;overflow:visible;filter:drop-shadow(0 3px 0 #00000012)}
    .tile.hint{animation:none;box-shadow:0 0 0 4px #fff4c5,inset 0 3px 0 #ffffff26;z-index:2}.tile.selected{border-color:#fff7d5;box-shadow:0 0 0 3px var(--accent),inset 0 3px 0 #ffffff26;transform:translateY(-4px) scale(1.025);z-index:3;animation:none}
    .tile.done{border-color:#b0ffbc72}.tile.just-solved{animation:solved .55s ease}
    .shape-circle{border-radius:50%}.tile .shape-circle{box-shadow:inset 0 0 0 4px #ffffff2a}
    .shape-diamond{border-radius:7px;transform:rotate(0deg)}.shape-square{border-radius:6px}.shape-triangle,.shape-bolt{width:100%;height:100%}
    .peek{pointer-events:none}
    .peek .tile{border-style:dashed;box-shadow:none}
    .matchlabel{display:flex;align-items:center;justify-content:center;gap:8px;min-height:29px;margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
    .matchlabel.good{color:#b8f2bf}.matchlabel strong{color:var(--ink)}
    .hintline{min-height:29px;margin:2px 6px 11px;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
    .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .action{background:#ffffff0c;border:1px solid #ffffff16;border-radius:15px;min-height:48px;padding:10px 4px;font-weight:650;font-size:14px}.action:active{background:#ffffff17}.action:disabled{opacity:.3}
    .footbuttons{display:flex;justify-content:space-between;gap:14px;margin-top:13px}.quiet{background:transparent;color:var(--muted);font-size:13px;min-height:40px;padding:9px 3px}.quiet:active{color:var(--ink)}
    .levels{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:17px 0 5px}.dotbutton{background:transparent;min-height:35px;display:grid;place-items:center;padding:0}.dot{height:7px;width:100%;max-width:23px;border-radius:9px;background:#ffffff1c}.dot.current{background:var(--accent);height:10px}.dot.finished{background:#95dab0}.dot.locked{background:#ffffff0b}
    .fineprint{font-size:11px;color:#b4c2b69c;text-align:center;line-height:1.5;margin:9px 0 0}
    .overlay{position:fixed;inset:0;background:#071e18e8;backdrop-filter:blur(10px);z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}.overlay[hidden]{display:none}.sheet{max-height:90svh;max-width:410px;width:100%;overflow-y:auto;padding:29px 25px 23px;border:1px solid #ffffff22;border-radius:26px;background:#244e42;box-shadow:var(--shadow);text-align:center}.sheet h2{font-size:30px;line-height:1.1;margin:12px 0 16px;letter-spacing:-.7px}.sheet p{color:#d1dfd2;line-height:1.6;font-size:15px;margin:10px 0}.bigicon{font-size:62px;margin:3px 0}.bigicon svg{width:74px;height:74px}.maincta{background:var(--accent);color:#253829;border-radius:15px;font-weight:800;font-size:17px;min-height:54px;width:100%;margin-top:13px}.outline{background:transparent;border:1px solid #bfd3c44a;border-radius:15px;width:100%;min-height:46px;margin-top:10px;font-size:15px}.steps{text-align:left;margin:23px 0}.step{display:flex;gap:12px;align-items:center;margin:16px 0}.stepnum{background:#ffffff0e;width:31px;height:31px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-weight:750;color:var(--accent)}.step span{font-size:14px;line-height:1.5;color:#dee9df}.legal{text-align:left;font-size:12px!important;line-height:1.6!important}.legal strong{color:var(--ink)}.levelpicker{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:17px 0}.levelpick{border:1px solid #ffffff19;background:#ffffff0c;min-height:46px;border-radius:14px}.levelpick.current{border:2px solid var(--accent)}
    .celebrate{position:fixed;top:25%;left:50%;width:290px;height:150px;transform:translateX(-50%);z-index:12;pointer-events:none;display:flex;justify-content:space-between}.confetti{width:13px;height:23px;border-radius:5px;animation:confetti 1.2s ease-out forwards}.confetti:nth-child(2n){background:#ffd777;animation-delay:.12s}.confetti:nth-child(3n){background:#8ce6bc;animation-delay:.2s}.confetti:nth-child(4n){background:#9cbefd;animation-delay:.34s}.confetti:nth-child(5n){background:#ffa68c;animation-delay:.08s}
    @keyframes breathe{50%{box-shadow:0 0 0 4px #ffffff90,inset 0 3px 0 #ffffff20;transform:translateY(-3px)}}
    @keyframes solved{0%{transform:scale(.88)}65%{transform:scale(1.05)}100%{transform:scale(1)}}
    @keyframes confetti{0%{opacity:1;transform:translateY(-30px) rotate(0)}100%{opacity:0;transform:translateY(300px) rotate(290deg)}}
    .goals.no-scroll{min-width:0;width:100%;max-width:100%;display:block;overflow:visible;padding:2px 0 6px}
    .no-scroll .goalrow{min-width:0;max-width:100%;display:grid;grid-template-columns:31px repeat(var(--goal-count),1fr);gap:4px;margin-bottom:7px;align-items:center;width:100%}
    .no-scroll .tile{max-width:34px;justify-self:center;width:100%;border-radius:6px}
    .no-scroll .goal-label{font-size:10px}
    @media(max-height:740px){.app{padding-top:9px}.wordmark{font-size:20px}.heroinfo{margin:12px 0 12px}h1{font-size:26px}.goalbox{padding-top:8px;padding-bottom:8px}.board{gap:5px;padding:8px}.gridrow{gap:5px}.hintline{margin-bottom:7px}.action{min-height:43px}}
    @media(min-height:850px){.app{padding-top:25px}.heroinfo{margin-top:33px}.board{gap:8px}.tile{border-radius:17px}}
    @media(max-height:740px){.app{padding-top:9px}.wordmark{font-size:20px}.heroinfo{margin:12px 0 12px}h1{font-size:26px}.moves strong{font-size:24px}.board{padding:8px}.controls .action{min-height:43px}.levels{margin-top:11px}.footbuttons{margin-top:8px}.fineprint{margin-top:5px}.hintline{margin-bottom:7px}}
    @media(max-width:370px){.app{padding-left:13px;padding-right:13px}.board{gap:5px}.gridrow{gap:4px}.goalbox{padding:8px}.goalhead{font-size:12px}.smallcaps{font-size:11px}.no-scroll .goalrow{min-width:0;max-width:100%;gap:3px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Farbwirbel Musterpuzzle">
    <header>
      <div class="wordmark"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Farbwirbel</div>
      <div class="headerbuttons">
        <button id="soundBtn" class="iconbutton" aria-label="Ton ausschalten" title="Ton">♪</button>
        <button id="helpBtn" class="iconbutton" aria-label="So wird gespielt" title="Spielanleitung">?</button>
      </div>
    </header>

    <div class="heroinfo">
      <div><div id="levelKicker" class="smallcaps">Level 1 von 10</div><h1 id="levelTitle">Erster Wirbel</h1></div>
      <div class="moves"><strong id="moves">0</strong><span id="moveLabel">Züge</span></div>
    </div>

    <section class="goalbox" aria-label="Zielmuster">
      <div class="goalhead"><strong id="goalTitle">Dein Ziel: Gleiches sammeln</strong><span id="rowsDone">0 von 3</span></div>
      <div class="goals" id="goals"></div>
    </section>

    <section class="board" id="board" aria-label="Spielfeld"></section>
    <div class="matchlabel" id="matchLabel" role="status" aria-live="polite"></div>
    <div class="hintline" id="hintText">Tippe zwei nebeneinanderliegende Kacheln an, um sie zu tauschen.</div>

    <div class="controls">
      <button class="action" id="hintBtn">Hinweis</button>
      <button class="action" id="undoBtn" disabled>Rückgängig</button>
      <button class="action" id="resetBtn">Neu starten</button>
    </div>
    <div class="footbuttons">
      <button class="quiet" id="levelsBtn">Level wählen</button>
      <button class="quiet" id="legalBtn">Testversion · Info</button>
    </div>
    <div class="levels" id="levelDots" aria-label="Level-Fortschritt"></div>
    <p class="fineprint">Ohne Konto · Offline spielbar · Fortschritt nur auf diesem Gerät</p>
  </main>

  <div class="overlay" id="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section>
  </div>
  <div class="celebrate" id="celebrate" hidden aria-hidden="true"></div>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js').catch(function() { /* Offline-Cache ist eine Zusatzfunktion. */ });
      });
    }
  </script>
</body>
</html>
